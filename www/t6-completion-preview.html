<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>태극 6장 완료 자세 확인</title>
<style>body{font-family:system-ui;background:#eef2f6;margin:16px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}figure{margin:0;background:white;padding:5px;border:1px solid #bbc7d4}img{width:100%;display:block}figcaption{text-align:center;font-weight:700}</style>
</head><body><main id="grid"></main><script>
const items=[
["2 후보",12.1],["2 후보",12.3],["2 후보",12.5],["2 후보",12.7],
["2 후보",12.9],["2 후보",13.1],["4 후보",15.1],["4 후보",15.3],
["4 후보",15.5],["4 후보",15.7],["4 후보",15.9],["4 후보",16.1]
];
for(const [id,time] of items){
  const index=Math.round(time*5+0.5);
  const figure=document.createElement("figure");
  figure.innerHTML=`<img src="./t6-replacement/frames/frame-${String(index).padStart(4,"0")}.jpg"><figcaption>${id}번 · ${time.toFixed(1)}초</figcaption>`;
  grid.append(figure);
}
</script></body></html>
